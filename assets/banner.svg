<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913" />
      <stop offset="50%" stop-color="#0d1326" />
      <stop offset="100%" stop-color="#05070e" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>

    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FA709A" />
      <stop offset="100%" stop-color="#FEE140" />
    </linearGradient>

    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38ef7d" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#11998e" stop-opacity="0.2" />
    </linearGradient>

    <!-- Filter for Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f2942" stroke-width="0.7" stroke-opacity="0.5" />
    </pattern>

    <!-- Dynamic Pulse Animations -->
    <style>
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.85; }
        50% { transform: scale(1.18); opacity: 1; filter: drop-shadow(0 0 10px #00F2FE); }
      }
      @keyframes scanline {
        0% { transform: translateY(0); opacity: 0.2; }
        50% { opacity: 0.6; }
        100% { transform: translateY(420px); opacity: 0.2; }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes dashAnim {
        to { stroke-dashoffset: -40; }
      }
      @keyframes spineAlert {
        0%, 100% { stroke: #00F2FE; }
        50% { stroke: #38ef7d; }
      }
      .node-pulse {
        animation: pulse 3s infinite ease-in-out;
        transform-origin: center;
      }
      .node-pulse-delayed {
        animation: pulse 3.5s infinite ease-in-out;
        animation-delay: 1.2s;
        transform-origin: center;
      }
      .scanner-beam {
        animation: scanline 7s infinite linear;
      }
      .floating-pill {
        animation: floatSlow 5s infinite ease-in-out;
      }
      .skeleton-edge {
        stroke-dasharray: 6 3;
        animation: dashAnim 6s linear infinite;
      }
      .spine-track {
        animation: spineAlert 4s infinite ease-in-out;
      }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="100%" height="100%" fill="url(#bg-grad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Ambient Light Orbs (Background depth) -->
  <circle cx="150" cy="90" r="140" fill="#00F2FE" opacity="0.08" filter="url(#glow)" />
  <circle cx="1060" cy="200" r="170" fill="#7F00FF" opacity="0.10" filter="url(#glow)" />
  <circle cx="950" cy="340" r="130" fill="#38ef7d" opacity="0.08" filter="url(#glow)" />

  <!-- Scanning Laser Effect (Low opacity background) -->
  <g class="scanner-beam">
    <line x1="0" y1="0" x2="1200" y2="0" stroke="#00F2FE" stroke-width="1.5" stroke-opacity="0.35" />
    <polygon points="0,0 1200,0 1200,20 0,20" fill="url(#accent-cyan)" opacity="0.04" />
  </g>

  <!-- Right Side Interactive Skeletal Mesh / Biomechanical Posture Visualizer -->
  <g transform="translate(870, 45)">
    <!-- Bounding Tracking Box with Corner Crosshairs -->
    <rect x="20" y="20" width="260" height="310" rx="16" fill="#0d172e" fill-opacity="0.65" stroke="#253a60" stroke-width="1.5" />
    <path d="M 20 45 L 20 20 L 45 20" fill="none" stroke="#00F2FE" stroke-width="3" />
    <path d="M 255 20 L 280 20 L 280 45" fill="none" stroke="#00F2FE" stroke-width="3" />
    <path d="M 20 305 L 20 330 L 45 330" fill="none" stroke="#00F2FE" stroke-width="3" />
    <path d="M 255 330 L 280 330 L 280 305" fill="none" stroke="#00F2FE" stroke-width="3" />

    <!-- Angle Indicator Overlay -->
    <rect x="35" y="32" width="110" height="24" rx="6" fill="#132342" stroke="#2b4372" stroke-width="1" />
    <circle cx="47" cy="44" r="4" fill="#38ef7d" />
    <text x="58" y="48" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" letter-spacing="0.5">SPINE: 92° (GOOD)</text>

    <!-- Skeletal Connections (Limbs & Spine) -->
    <!-- Head to Neck -->
    <line x1="150" y1="65" x2="150" y2="95" stroke="#38ef7d" stroke-width="2.5" class="spine-track" />
    <!-- Clavicle / Shoulders -->
    <line x1="95" y1="110" x2="150" y2="95" stroke="#4FACFE" stroke-width="2" />
    <line x1="150" y1="95" x2="205" y2="110" stroke="#4FACFE" stroke-width="2" />
    <!-- Arms -->
    <line x1="95" y1="110" x2="70" y2="160" stroke="#4FACFE" stroke-width="1.8" />
    <line x1="70" y1="160" x2="55" y2="210" stroke="#4FACFE" stroke-width="1.8" />
    <line x1="205" y1="110" x2="230" y2="160" stroke="#4FACFE" stroke-width="1.8" />
    <line x1="230" y1="160" x2="245" y2="210" stroke="#4FACFE" stroke-width="1.8" />
    <!-- Spine Line -->
    <line x1="150" y1="95" x2="150" y2="150" stroke="#38ef7d" stroke-width="2.8" class="spine-track" />
    <line x1="150" y1="150" x2="150" y2="200" stroke="#38ef7d" stroke-width="2.8" class="spine-track" />
    <!-- Pelvis -->
    <line x1="115" y1="200" x2="150" y2="200" stroke="#00F2FE" stroke-width="2" />
    <line x1="150" y1="200" x2="185" y2="200" stroke="#00F2FE" stroke-width="2" />
    <!-- Legs -->
    <line x1="115" y1="200" x2="105" y2="260" stroke="#00F2FE" stroke-width="2" />
    <line x1="105" y1="260" x2="100" y2="310" stroke="#00F2FE" stroke-width="2" />
    <line x1="185" y1="200" x2="195" y2="260" stroke="#00F2FE" stroke-width="2" />
    <line x1="195" y1="260" x2="200" y2="310" stroke="#00F2FE" stroke-width="2" />

    <!-- Dynamic Animated Keypoint Landmarks (Joints) -->
    <!-- Head / Cranium -->
    <circle cx="150" cy="65" r="9" fill="#00F2FE" fill-opacity="0.2" stroke="#00F2FE" stroke-width="2" filter="url(#subtle-glow)" class="node-pulse" />
    <circle cx="150" cy="65" r="4.5" fill="#ffffff" />
    <!-- Neck -->
    <circle cx="150" cy="95" r="5" fill="#38ef7d" class="node-pulse" />
    <!-- Shoulders -->
    <circle cx="95" cy="110" r="5" fill="#00F2FE" class="node-pulse-delayed" />
    <circle cx="205" cy="110" r="5" fill="#00F2FE" class="node-pulse-delayed" />
    <!-- Elbows -->
    <circle cx="70" cy="160" r="4" fill="#4FACFE" />
    <circle cx="230" cy="160" r="4" fill="#4FACFE" />
    <!-- Wrists -->
    <circle cx="55" cy="210" r="3.5" fill="#FA709A" />
    <circle cx="245" cy="210" r="3.5" fill="#FA709A" />
    <!-- Spine Center / Pelvis -->
    <circle cx="150" cy="150" r="4" fill="#38ef7d" class="node-pulse" />
    <circle cx="150" cy="200" r="5" fill="#00F2FE" class="node-pulse" />
    <circle cx="115" cy="200" r="4" fill="#4FACFE" />
    <circle cx="185" cy="200" r="4" fill="#4FACFE" />
    <!-- Knees -->
    <circle cx="105" cy="260" r="4" fill="#00F2FE" />
    <circle cx="195" cy="260" r="4" fill="#00F2FE" />
    <!-- Ankles -->
    <circle cx="100" cy="310" r="3.5" fill="#38ef7d" />
    <circle cx="200" cy="310" r="3.5" fill="#38ef7d" />
  </g>

  <!-- Foreground Content: Header, Title, Subtitle, Feature Badges (Always crisp & on top) -->
  <g transform="translate(60, 65)">
    <!-- Category Pill Tag -->
    <g class="floating-pill">
      <rect x="0" y="0" width="270" height="28" rx="14" fill="#15203b" stroke="#2a3f6d" stroke-width="1.2" />
      <circle cx="14" cy="14" r="5" fill="#00F2FE" filter="url(#subtle-glow)" />
      <text x="28" y="18" fill="#38ef7d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1">CURATED AWESOME ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="78" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="37" font-weight="800" letter-spacing="-0.5">
      Computer Vision Posture Tracking
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="116" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="400">
      Real-Time Posture Estimation • 2D/3D Human Pose • Biomechanics • Desk Ergonomics
    </text>

    <!-- Detailed Highlights Line -->
    <text x="0" y="145" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500">
      YOLO-Pose • MediaPipe • MMPose • RTMPose • OpenPose • WHAM • 4D-Humans • Edge AI
    </text>

    <!-- Interactive / Feature Badges Row -->
    <g transform="translate(0, 180)">
      <!-- Badge 1: 3D Body Mesh -->
      <g>
        <rect x="0" y="0" width="135" height="34" rx="8" fill="#0e172a" stroke="#1e293b" stroke-width="1" />
        <rect x="8" y="8" width="18" height="18" rx="4" fill="#00F2FE" fill-opacity="0.15" />
        <text x="17" y="21" fill="#00F2FE" font-size="11" text-anchor="middle">🎯</text>
        <text x="34" y="22" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">3D Body Pose</text>
      </g>

      <!-- Badge 2: Spine Tracking -->
      <g transform="translate(145, 0)">
        <rect x="0" y="0" width="145" height="34" rx="8" fill="#0e172a" stroke="#1e293b" stroke-width="1" />
        <rect x="8" y="8" width="18" height="18" rx="4" fill="#38ef7d" fill-opacity="0.15" />
        <text x="17" y="21" fill="#38ef7d" font-size="11" text-anchor="middle">⚡</text>
        <text x="34" y="22" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">Spine Alignment</text>
      </g>

      <!-- Badge 3: Desk Ergonomics -->
      <g transform="translate(300, 0)">
        <rect x="0" y="0" width="145" height="34" rx="8" fill="#0e172a" stroke="#1e293b" stroke-width="1" />
        <rect x="8" y="8" width="18" height="18" rx="4" fill="#FA709A" fill-opacity="0.15" />
        <text x="17" y="21" fill="#FA709A" font-size="11" text-anchor="middle">🪑</text>
        <text x="34" y="22" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">Desk Ergonomics</text>
      </g>

      <!-- Badge 4: Edge & Local Webcams -->
      <g transform="translate(455, 0)">
        <rect x="0" y="0" width="155" height="34" rx="8" fill="#0e172a" stroke="#1e293b" stroke-width="1" />
        <rect x="8" y="8" width="18" height="18" rx="4" fill="#FEE140" fill-opacity="0.15" />
        <text x="17" y="21" fill="#FEE140" font-size="11" text-anchor="middle">🔒</text>
        <text x="34" y="22" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">Privacy &amp; Edge First</text>
      </g>
    </g>

    <!-- Tech Stack Indicator Line -->
    <g transform="translate(0, 245)">
      <circle cx="6" cy="6" r="3" fill="#38ef7d" />
      <text x="16" y="10" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500">
        Curated SaaS Platforms &amp; Top Open-Source Frameworks • Constantly Maintained
      </text>
    </g>
  </g>
</svg>
